<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f1e7">
<title>Reparto · once</title>
<style>
:root{color-scheme:light;--paper:#f5f1e7;--surface:#fffdf8;--surface2:#eee9dc;--ink:#1d2921;--muted:#627068;--line:#d8ded2;--green:#17633f;--green2:#dcebdc;--orange:#e89139;--orange2:#fff0d9;--red:#a83225;--red2:#fbe5dd;--map:#e8eddf;--road:#fffdf7;--shadow:0 22px 80px #25392d24;--navh:76px}
:root[data-theme="dark"]{color-scheme:dark;--paper:#141a16;--surface:#202923;--surface2:#2a342d;--ink:#eff5ec;--muted:#b0bdb3;--line:#3b4940;--green:#8bd3a2;--green2:#273d30;--orange:#ffc175;--orange2:#4a3722;--red:#ff9583;--red2:#462b28;--map:#253329;--road:#344239;--shadow:0 22px 80px #0008}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:#dfe4db;color:var(--ink);font:500 16px/1.35 ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;place-items:center}button{font:inherit;color:inherit;cursor:pointer}button:focus-visible{outline:3px solid var(--orange);outline-offset:3px}.phone{height:min(900px,100dvh);width:min(430px,100vw);background:var(--paper);position:relative;display:flex;flex-direction:column;overflow:hidden}@media(min-width:520px){.phone{height:min(900px,calc(100dvh - 36px));border:8px solid #18211c;border-radius:38px;box-shadow:var(--shadow)}}
.top{padding:calc(14px + env(safe-area-inset-top)) 20px 12px;display:flex;align-items:center;gap:12px}.brand{width:44px;height:44px;display:grid;place-items:center;border-radius:15px;background:var(--green);color:white;font-size:24px;transform:rotate(-5deg);box-shadow:4px 4px 0 var(--orange)}.topcopy{flex:1}.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:800}.top h1{font-size:24px;line-height:1.1;margin:2px 0 0;font-weight:850;letter-spacing:-.04em}.theme{border:1px solid var(--line);background:var(--surface);border-radius:14px;width:48px;height:48px;font-size:20px}.testline{margin:0 16px 12px;border-radius:12px;padding:8px 11px;background:var(--orange2);color:var(--ink);font-size:12px;font-weight:750;display:flex;align-items:center;gap:8px}.testdot{width:8px;height:8px;border-radius:99px;background:var(--orange);box-shadow:0 0 0 3px color-mix(in srgb,var(--orange) 22%,transparent)}main{flex:1;overflow:auto;padding:0 16px 20px;scrollbar-width:thin;scrollbar-color:var(--line) transparent}.screen{display:none}.screen.active{display:block}.intro{display:flex;align-items:end;justify-content:space-between;margin:2px 2px 12px}.intro h2{font-size:19px;margin:0;font-weight:850;letter-spacing:-.03em}.intro p{margin:3px 0 0;color:var(--muted);font-size:13px}.daypill{background:var(--surface);border:1px solid var(--line);padding:7px 10px;border-radius:999px;font-size:12px;font-weight:800;white-space:nowrap}.summary{display:flex;gap:8px;margin-bottom:12px}.metric{flex:1;background:var(--surface);border:1px solid var(--line);padding:10px 12px;border-radius:15px}.metric b{display:block;font-size:21px;letter-spacing:-.04em}.metric span{font-size:11px;color:var(--muted);font-weight:700}.order{width:100%;text-align:left;border:1px solid var(--line);border-radius:19px;background:var(--surface);padding:14px;margin:0 0 10px;box-shadow:0 3px 0 #19251b08;min-height:110px}.order.current{border:2px solid var(--green);padding:13px;box-shadow:0 4px 0 color-mix(in srgb,var(--green) 20%,transparent)}.order.done{opacity:.66}.orderhead{display:flex;align-items:center;gap:11px}.stop{width:42px;height:42px;flex:none;border-radius:14px;display:grid;place-items:center;background:var(--orange2);color:#724511;font-size:18px;font-weight:900;transform:rotate(-3deg)}:root[data-theme="dark"] .stop{color:#ffe1ad}.stop.ok{background:var(--green2);color:var(--green)}.stop.issue{background:var(--red2);color:var(--red)}.identity{flex:1;min-width:0}.number{font-size:20px;font-weight:900;letter-spacing:-.04em}.customer{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}.amount{text-align:right;font-size:19px;font-weight:900;letter-spacing:-.04em;white-space:nowrap}.orderfoot{margin:10px 0 0 53px;display:flex;justify-content:space-between;gap:8px;align-items:center}.items{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.paytag{font-size:11px;font-weight:850;border-radius:9px;padding:5px 8px;white-space:nowrap;background:var(--green2);color:var(--green)}.paytag.charge{background:var(--red2);color:var(--red)}.paytag.wait{background:var(--orange2);color:#805016}:root[data-theme="dark"] .paytag.wait{color:#ffcf8f}.mini{font-size:11px;color:var(--muted);font-weight:700}.mapcard{position:relative;border:1px solid var(--line);border-radius:20px;overflow:hidden;background:var(--map);height:365px}.mapcard svg{width:100%;height:100%;display:block}.mapbadge{position:absolute;top:12px;left:12px;background:var(--surface);border:1px solid var(--line);padding:8px 11px;border-radius:12px;font-size:12px;font-weight:850;box-shadow:0 2px 9px #0001}.routeinfo{background:var(--surface);border:1px solid var(--line);border-radius:18px;margin-top:11px;padding:14px;display:flex;align-items:center;gap:12px}.routeinfo .stop{width:44px;height:44px}.routeinfo b{display:block}.routeinfo small{color:var(--muted)}.routeinfo .spacer{flex:1}.btn{width:100%;min-height:56px;border:0;border-radius:16px;background:var(--green);color:white;font-weight:850;font-size:16px;margin-top:10px;box-shadow:0 4px 0 color-mix(in srgb,var(--green) 30%,transparent)}.btn.secondary{background:var(--surface);color:var(--green);border:1px solid var(--line);box-shadow:none}.btn.warn{background:var(--red);box-shadow:0 4px 0 color-mix(in srgb,var(--red) 30%,transparent)}.mapbuttons{display:grid;grid-template-columns:1fr 1fr;gap:9px}.mapbuttons .btn{font-size:14px}.details-head{display:flex;align-items:center;gap:12px;padding:8px 1px 14px}.back{border:0;background:transparent;color:var(--green);font-size:15px;font-weight:850;padding:7px 0 10px}.address{background:var(--surface2);border-radius:15px;padding:13px;margin-bottom:10px;display:flex;gap:10px;align-items:start}.address strong{display:block}.address small{color:var(--muted)}.detailbox{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:13px;margin-bottom:10px}.detailbox h3{font-size:14px;margin:0 0 6px}.itemrow,.totalrow{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}.itemrow:last-of-type{border:0}.itemrow span:first-child{font-weight:650}.itemrow span:last-child{font-weight:850}.totalrow{border-top:1px solid var(--line);border-bottom:0;font-weight:900;font-size:17px}.collect{padding:13px;border-radius:15px;background:var(--red2);color:var(--red);font-weight:900;margin-top:9px}.collect small{display:block;font-size:12px;margin-top:2px}.contactrow{display:grid;grid-template-columns:1fr 1fr;gap:9px}.contactrow .btn{margin:0;min-height:52px;font-size:14px}.actionstack{display:grid;gap:8px;margin-top:10px}.actionstack .btn{margin:0;min-height:58px}.actionstack .btn.secondary{color:var(--ink)}.closehero{background:var(--green);color:white;border-radius:22px;padding:18px;margin:5px 0 12px;position:relative;overflow:hidden}.closehero:after{content:"✳";position:absolute;right:6px;top:-38px;font-size:140px;color:#ffffff15;transform:rotate(18deg)}.closehero .eyebrow{color:#d2e9d5}.closehero strong{display:block;font-size:32px;letter-spacing:-.05em;margin:3px 0}.closehero span{font-size:13px;color:#d2e9d5}.closegrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.closecard{border:1px solid var(--line);background:var(--surface);border-radius:17px;padding:13px;min-height:98px}.closecard span{font-size:12px;color:var(--muted);font-weight:750}.closecard strong{display:block;font-size:23px;letter-spacing:-.04em;margin-top:5px}.smallnote{margin:13px 3px;color:var(--muted);font-size:12px;line-height:1.45}.reset{min-height:48px;width:100%;border:1px dashed var(--line);background:transparent;color:var(--muted);border-radius:14px;font-weight:800}.bottom{height:calc(var(--navh) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border-top:1px solid var(--line);flex:none}.navbtn{border:0;background:transparent;color:var(--muted);font-size:11px;font-weight:850;display:flex;flex-direction:column;gap:3px;align-items:center;justify-content:center;position:relative}.navbtn .icon{font-size:21px;line-height:1}.navbtn.active{color:var(--green)}.navbtn.active:before{content:"";position:absolute;top:0;width:34px;height:3px;background:var(--orange);border-radius:0 0 4px 4px}.toast{position:absolute;bottom:calc(var(--navh) + 16px + env(safe-area-inset-bottom));left:16px;right:16px;padding:13px 15px;background:var(--ink);color:var(--surface);border-radius:14px;font-size:14px;font-weight:750;display:none;z-index:5;box-shadow:var(--shadow)}
</style>
</head>
<body><div class="phone" id="app">
<header class="top"><div class="brand" aria-hidden="true">✳</div><div class="topcopy"><div class="eyebrow">once · verdulería</div><h1 id="title">Para repartir</h1></div><button class="theme" aria-label="Cambiar tema" onclick="toggleTheme()">☼</button></header>
<div class="testline"><i class="testdot"></i> Maqueta interactiva · todos los pedidos son de prueba</div>
<main>
<section class="screen active" id="screen-list"></section><section class="screen" id="screen-map"></section><section class="screen" id="screen-detail"></section><section class="screen" id="screen-close"></section>
</main>
<nav class="bottom" aria-label="Navegación principal"><button class="navbtn active" data-tab="list" onclick="show('list')"><span class="icon">▤</span>Repartir</button><button class="navbtn" data-tab="map" onclick="show('map')"><span class="icon">⌖</span>Ruta</button><button class="navbtn" data-tab="close" onclick="show('close')"><span class="icon">▣</span>Cierre</button></nav><div class="toast" id="toast" role="status"></div>
</div>
<script>
const pedidos=[
{id:1,n:'W-0412',nom:'Lucía Brizuela',tel:'3804555012',dir:'Pasaje de los Sauces 128',productos:[['Tomate perita','2 kg'],['Lechuga criolla','1 un.'],['Zanahoria','1,5 kg']],total:9800,ef:0,tr:0,pago:'Pagado · Mercado Pago',estado:'pendiente',x:260,y:118},
{id:2,n:'W-0413',nom:'Tomás Ledesma',tel:'3804555013',dir:'Calle del Algarrobo 45',productos:[['Papa','5 kg'],['Cebolla','2 kg'],['Zapallo anco','1 un.'],['Banana','2 kg']],total:18400,ef:18400,tr:0,pago:'Cobrar en efectivo',estado:'pendiente',x:130,y:195},
{id:3,n:'W-0415',nom:'Familia Herrera',tel:'3804555015',dir:'Avenida de los Lapachos 890',productos:[['Manzana roja','3 kg'],['Limón','1 kg'],['Palta','4 un.']],total:12900,ef:0,tr:12900,pago:'Cobrar por transferencia',estado:'pendiente',x:315,y:244},
{id:4,n:'W-0416',nom:'Rosa Mistol',tel:'3804555016',dir:'Calle del Chañar 310',productos:[['Papa','10 kg'],['Tomate redondo','3 kg'],['Frutilla','1 kg'],['Acelga','2 at.']],total:19500,ef:10000,tr:9500,pago:'Cobro combinado',estado:'pendiente',x:90,y:305},
{id:5,n:'W-0418',nom:'Dani Carrizo',tel:'3804555018',dir:'Pasaje del Tala 15',productos:[['Naranja','5 kg'],['Zapallito','2 kg'],['Batata','3 kg'],['Ajo','1 un.']],total:23100,ef:23100,tr:0,pago:'Cobrar en efectivo',estado:'pendiente',x:210,y:348},
{id:6,n:'W-0419',nom:'Marta Olmos',tel:'3804555019',dir:'Calle de la Jarilla 77',productos:[['Choclo','6 un.'],['Pimiento rojo','1 kg']],total:7800,ef:0,tr:0,pago:'Pagado · transferencia',estado:'pendiente',x:345,y:125}
];
let current=2,tab='list';
const money=n=>new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:0}).format(n);
const open=()=>pedidos.filter(p=>p.estado==='pendiente'||p.estado==='llegue');
const paid=p=>p.ef+p.tr===0;
function payment(p){if(paid(p))return `<span class="paytag">✓ ${p.pago}</span>`;let txt=p.ef&&p.tr?`${money(p.ef)} ef. + ${money(p.tr)} transf.`:p.ef?`${money(p.ef)} en efectivo`:`${money(p.tr)} por transferencia`;return `<span class="paytag charge">Cobrar ${money(p.ef+p.tr)} · ${txt}</span>`}
function card(p,i){let done=p.estado==='entregado',problem=p.estado==='problema',iscur=p.id===open()[0]?.id;return `<button class="order ${iscur?'current':''} ${done||problem?'done':''}" onclick="detail(${p.id})"><div class="orderhead"><div class="stop ${done?'ok':problem?'issue':''}">${done?'✓':problem?'!':String(i+1).padStart(2,'0')}</div><div class="identity"><div class="number">#${p.n}</div><div class="customer">${p.nom} · ${p.dir}</div></div><div class="amount">${money(p.total)}</div></div><div class="orderfoot"><span class="items">${p.productos.slice(0,2).map(x=>x[0]).join(' · ')}${p.productos.length>2?` · +${p.productos.length-2}`:''}</span>${done?'<span class="paytag">Entregado</span>':problem?'<span class="paytag wait">Revisar</span>':payment(p)}</div></button>`}
function renderList(){let n=open().length,done=pedidos.filter(p=>p.estado==='entregado').length;document.getElementById('screen-list').innerHTML=`<div class="intro"><div><h2>La vuelta de hoy</h2><p>${n} para entregar · ${done} completados</p></div><span class="daypill">HOY · DEMO</span></div><div class="summary"><div class="metric"><b>${n}</b><span>PARA ENTREGAR</span></div><div class="metric"><b>${money(open().reduce((a,p)=>a+p.ef+p.tr,0))}</b><span>POR COBRAR</span></div></div>${pedidos.map((p,i)=>card(p,i)).join('')}<p class="smallnote">Direcciones y pedidos inventados para mostrar el flujo. La lista real se filtraría por WhatsApp, armado listo y pago confirmado o pendiente al entregar.</p>`}
function svgMap(){const pts=pedidos.map((p,i)=>`${i?`L ${p.x} ${p.y}`:`M ${p.x} ${p.y}`}`).join(' ');return `<svg viewBox="0 0 420 430" aria-label="Mapa ilustrado con seis paradas de prueba" role="img"><rect width="420" height="430" fill="var(--map)"/><path d="M0 68H420M0 160H420M0 254H420M0 346H420M65 0V430M165 0V430M265 0V430M365 0V430M0 400L420 32" fill="none" stroke="var(--road)" stroke-width="19"/><path d="M0 68H420M0 160H420M0 254H420M0 346H420M65 0V430M165 0V430M265 0V430M365 0V430M0 400L420 32" fill="none" stroke="var(--line)" stroke-width="1.5"/><path d="M260 118 L130 195 L315 244 L90 305 L210 348 L345 125" fill="none" stroke="var(--green)" stroke-width="6" stroke-dasharray="1 0" stroke-linecap="round" stroke-linejoin="round" opacity=".85"/><g fill="var(--green2)" opacity=".9"><rect x="185" y="80" width="48" height="28" rx="7"/><rect x="292" y="280" width="55" height="34" rx="7"/><rect x="25" y="215" width="47" height="28" rx="7"/></g>${pedidos.map((p,i)=>`<g transform="translate(${p.x} ${p.y})"><circle r="19" fill="${p.estado==='entregado'?'var(--green)':p.estado==='problema'?'var(--red)':'var(--orange)'}" stroke="var(--surface)" stroke-width="4"/><text y="5" text-anchor="middle" font-size="13" font-weight="900" fill="${p.estado==='entregado'?'white':'#32200d'}">${p.estado==='entregado'?'✓':i+1}</text></g>`).join('')}<g transform="translate(205 22)"><path d="M0 19c0-12 10-19 21-19s21 7 21 19c0 14-21 35-21 35S0 33 0 19" fill="var(--green)" stroke="var(--surface)" stroke-width="3"/><circle cx="21" cy="19" r="7" fill="var(--surface)"/><text x="21" y="70" text-anchor="middle" font-size="11" font-weight="800" fill="var(--ink)">LOCAL</text></g></svg>`}
function renderMap(){let p=pedidos.find(x=>x.id===open()[0]?.id);document.getElementById('screen-map').innerHTML=`<div class="intro"><div><h2>Ruta de hoy</h2><p>Paradas sugeridas · vista de prueba</p></div><span class="daypill">${open().length} PARADAS</span></div><div class="mapcard">${svgMap()}<div class="mapbadge">✳ Local Once · inicio</div></div>${p?`<div class="routeinfo"><div class="stop">${pedidos.indexOf(p)+1}</div><div><b>Siguiente parada · #${p.n}</b><small>${p.dir}</small></div><span class="spacer"></span><b>${money(p.total)}</b></div><button class="btn" onclick="toast('En la app real abriría la navegación hasta ${p.dir}.')">↗&nbsp; Abrir en Google Maps</button><div class="mapbuttons"><button class="btn secondary" onclick="toast('En la app real se abriría Waze con esta parada.')">Abrir en Waze</button><button class="btn secondary" onclick="detail(${p.id})">Ver entrega →</button></div>`:`<div class="routeinfo"><b>¡Vuelta terminada!</b></div>`}<p class="smallnote">Mapa ilustrado para la maqueta. Las ubicaciones no son reales y el orden es demostrativo; la ruta real requiere coordenadas confirmadas.</p>`}
function detail(id){current=id;show('detail')}
function renderDetail(){let p=pedidos.find(x=>x.id===current);if(!p){show('list');return}let done=p.estado==='entregado',issue=p.estado==='problema',at=p.estado==='llegue';document.getElementById('screen-detail').innerHTML=`<button class="back" onclick="show('list')">← Volver a la vuelta</button><div class="details-head"><div class="stop ${done?'ok':issue?'issue':''}">${done?'✓':issue?'!':pedidos.indexOf(p)+1}</div><div class="identity"><div class="number">#${p.n}</div><div class="customer">${p.nom}</div></div><div class="amount">${money(p.total)}</div></div><div class="address"><span>⌖</span><div><strong>${p.dir}</strong><small>La Rioja · dirección ficticia</small></div></div><div class="detailbox"><h3>Pedido · ${p.productos.length} productos</h3>${p.productos.map(x=>`<div class="itemrow"><span>${x[0]}</span><span>${x[1]}</span></div>`).join('')}<div class="totalrow"><span>Total del pedido</span><span>${money(p.total)}</span></div>${paid(p)?'<div class="paytag" style="margin-top:8px">✓ '+p.pago+'</div>':`<div class="collect">Cobrar ${money(p.ef+p.tr)}<small>${p.ef?money(p.ef)+' en efectivo':''}${p.ef&&p.tr?' + ':''}${p.tr?money(p.tr)+' por transferencia':''}</small></div>`}</div><div class="contactrow"><button class="btn secondary" onclick="toast('La llamada se habilita al conectar el teléfono del cliente.')">☎ Llamar</button><button class="btn secondary" onclick="toast('WhatsApp se habilita al conectar el teléfono del cliente.')">◉ WhatsApp</button></div>${done||issue?`<div class="actionstack"><button class="btn secondary" onclick="setStatus(${p.id},'pendiente')">Deshacer estado</button></div>`:`<div class="actionstack"><button class="btn secondary" onclick="setStatus(${p.id},'llegue')">${at?'✓ Ya llegué':'Llegué'}</button><button class="btn" onclick="setStatus(${p.id},'entregado')">Entregado${paid(p)?'':' · cobré'}</button><button class="btn warn" onclick="setStatus(${p.id},'problema')">No estaba / Problema</button></div>`}<p class="smallnote">Las acciones solo cambian esta demostración y se reinician al recargar la página.</p>`}
function renderClose(){let done=pedidos.filter(p=>p.estado==='entregado'),pending=pedidos.filter(p=>p.estado==='pendiente'||p.estado==='llegue'),issue=pedidos.filter(p=>p.estado==='problema');let ef=done.reduce((s,p)=>s+p.ef,0),tr=done.reduce((s,p)=>s+p.tr,0);document.getElementById('screen-close').innerHTML=`<div class="intro"><div><h2>Cierre del día</h2><p>Resumen de esta vuelta de prueba</p></div><span class="daypill">DEMO</span></div><div class="closehero"><div class="eyebrow">Entregas completadas</div><strong>${done.length} <span style="font-size:18px">/ ${pedidos.length}</span></strong><span>${pending.length} pendientes${issue.length?' · '+issue.length+' con problema':''}</span></div><div class="closegrid"><div class="closecard"><span>EFECTIVO COBRADO</span><strong>${money(ef)}</strong></div><div class="closecard"><span>TRANSFERENCIAS</span><strong>${money(tr)}</strong></div><div class="closecard"><span>PENDIENTE DE COBRO</span><strong>${money(pending.reduce((s,p)=>s+p.ef+p.tr,0))}</strong></div><div class="closecard"><span>ENTREGAS CON PROBLEMA</span><strong>${issue.length}</strong></div></div><p class="smallnote">El cierre real debería guardar quién repartió, hora y resultado de cada visita, además de conciliar lo cobrado con caja.</p><button class="reset" onclick="resetDemo()">Reiniciar demostración</button>`}
function show(which){tab=which;document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));let target=which==='detail'?'detail':which;document.getElementById('screen-'+target).classList.add('active');document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.tab===(which==='detail'?'list':which)));document.getElementById('title').textContent={list:'Para repartir',map:'Ruta de hoy',detail:'Detalle de entrega',close:'Cierre del día'}[which];if(which==='list')renderList();if(which==='map')renderMap();if(which==='detail')renderDetail();if(which==='close')renderClose();document.querySelector('main').scrollTop=0}
function setStatus(id,s){let p=pedidos.find(x=>x.id===id);p.estado=s;toast(s==='entregado'?`Pedido #${p.n} marcado como entregado.`:s==='problema'?`Pedido #${p.n} marcado para revisar.`:'Llegada registrada.');show('detail')}
function toast(text){let el=document.getElementById('toast');el.textContent=text;el.style.display='block';clearTimeout(window._toastTimer);window._toastTimer=setTimeout(()=>el.style.display='none',2400)}
function toggleTheme(){let r=document.documentElement,mode=r.dataset.theme==='dark'?'light':'dark';r.dataset.theme=mode;document.querySelector('.theme').textContent=mode==='dark'?'☾':'☼'}
function resetDemo(){pedidos.forEach(p=>p.estado='pendiente');show('close');toast('Demostración reiniciada.')}
renderList();renderMap();renderClose();
</script></body></html>
