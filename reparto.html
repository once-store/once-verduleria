<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f1e7">
<title>Reparto · once</title>
<style>
:root{color-scheme:light;--paper:#f5f1e7;--surface:#fffdf8;--surface2:#eee9dc;--ink:#1d2921;--muted:#627068;--line:#d8ded2;--green:#17633f;--green2:#dcebdc;--orange:#e89139;--orange2:#fff0d9;--red:#a83225;--red2:#fbe5dd;--shadow:0 22px 80px #25392d24;--navh:76px}
:root[data-theme="dark"]{color-scheme:dark;--paper:#141a16;--surface:#202923;--surface2:#2a342d;--ink:#eff5ec;--muted:#b0bdb3;--line:#3b4940;--green:#8bd3a2;--green2:#273d30;--orange:#ffc175;--orange2:#4a3722;--red:#ff9583;--red2:#462b28;--shadow:0 22px 80px #0008}
@media (prefers-color-scheme:dark){:root:not([data-theme]){color-scheme:dark;--paper:#141a16;--surface:#202923;--surface2:#2a342d;--ink:#eff5ec;--muted:#b0bdb3;--line:#3b4940;--green:#8bd3a2;--green2:#273d30;--orange:#ffc175;--orange2:#4a3722;--red:#ff9583;--red2:#462b28;--shadow:0 22px 80px #0008}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:#dfe4db;color:var(--ink);font:500 16px/1.35 ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;place-items:center}
@media (prefers-color-scheme:dark){:root:not([data-theme]) body{background:#0c100d}}
:root[data-theme="dark"] body{background:#0c100d}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--orange);outline-offset:3px}
button:disabled{opacity:.55;cursor:default}
.phone{height:min(900px,100dvh);width:min(430px,100vw);background:var(--paper);position:relative;display:flex;flex-direction:column;overflow:hidden}
@media(min-width:520px){.phone{height:min(900px,calc(100dvh - 36px));border:8px solid #18211c;border-radius:38px;box-shadow:var(--shadow)}}
.top{padding:calc(14px + env(safe-area-inset-top)) 20px 12px;display:flex;align-items:center;gap:10px}
.brand{width:44px;height:44px;display:grid;place-items:center;border-radius:15px;background:var(--green);color:var(--paper);font-size:24px;transform:rotate(-5deg);box-shadow:4px 4px 0 var(--orange);flex:none}
.topcopy{flex:1;min-width:0}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:800}
.top h1{font-size:24px;line-height:1.1;margin:2px 0 0;font-weight:850;letter-spacing:-.04em}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:14px;width:48px;height:48px;font-size:20px;flex:none}
main{flex:1;overflow:auto;padding:0 16px 20px}
.screen{display:none}.screen.active{display:block}
.intro{display:flex;align-items:end;justify-content:space-between;margin:2px 2px 12px}
.intro h2{font-size:19px;margin:0;font-weight:850;letter-spacing:-.03em}
.intro p{margin:3px 0 0;color:var(--muted);font-size:13px}
.daypill{background:var(--surface);border:1px solid var(--line);padding:7px 10px;border-radius:999px;font-size:12px;font-weight:800;white-space:nowrap}
.summary{display:flex;gap:8px;margin-bottom:12px}
.metric{flex:1;background:var(--surface);border:1px solid var(--line);padding:10px 12px;border-radius:15px}
.metric b{display:block;font-size:21px;letter-spacing:-.04em}
.metric span{font-size:11px;color:var(--muted);font-weight:700}
.order{width:100%;text-align:left;border:1px solid var(--line);border-radius:19px;background:var(--surface);padding:14px;margin:0 0 10px;min-height:110px;display:block}
.order.current{border:2px solid var(--green);padding:13px}
.orderhead{display:flex;align-items:center;gap:11px}
.stop{width:42px;height:42px;flex:none;border-radius:14px;display:grid;place-items:center;background:var(--orange2);color:var(--ink);font-size:18px;font-weight:900;transform:rotate(-3deg)}
.stop.ok{background:var(--green2);color:var(--green)}
.stop.issue{background:var(--red2);color:var(--red)}
.identity{flex:1;min-width:0}
.number{font-size:20px;font-weight:900;letter-spacing:-.04em}
.customer{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.amount{text-align:right;font-size:19px;font-weight:900;letter-spacing:-.04em;white-space:nowrap}
.orderfoot{margin:10px 0 0 53px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.items{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.paytag{font-size:11px;font-weight:850;border-radius:9px;padding:5px 8px;white-space:nowrap;background:var(--green2);color:var(--green)}
.paytag.charge{background:var(--red2);color:var(--red)}
.paytag.wait{background:var(--orange2);color:var(--ink)}
.routeinfo{background:var(--surface);border:1px solid var(--line);border-radius:18px;margin-top:11px;padding:14px;display:flex;align-items:center;gap:12px}
.routeinfo .stop{width:44px;height:44px}
.routeinfo b{display:block}
.routeinfo small{color:var(--muted)}
.btn{width:100%;min-height:56px;border:0;border-radius:16px;background:var(--green);color:var(--paper);font-weight:850;font-size:16px;margin-top:10px;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn.secondary{background:var(--surface);color:var(--green);border:1px solid var(--line)}
.btn.warn{background:var(--red);color:var(--paper)}
.btn.off{opacity:.5;pointer-events:none}
.mapbuttons,.contactrow{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.mapbuttons .btn,.contactrow .btn{font-size:14px}
.contactrow .btn{margin:0;min-height:52px}
.back{border:0;background:transparent;color:var(--green);font-size:15px;font-weight:850;padding:7px 0 10px;min-height:48px}
.details-head{display:flex;align-items:center;gap:12px;padding:8px 1px 14px}
.address{background:var(--surface2);border-radius:15px;padding:13px;margin-bottom:10px;display:flex;gap:10px;align-items:start}
.address strong{display:block}
.address small{color:var(--muted)}
.detailbox{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:13px;margin-bottom:10px}
.detailbox h3{font-size:14px;margin:0 0 6px}
.itemrow,.totalrow{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.itemrow:last-of-type{border:0}
.itemrow span:last-child{font-weight:850}
.totalrow{border-top:1px solid var(--line);border-bottom:0;font-weight:900;font-size:17px}
.collect{padding:13px;border-radius:15px;background:var(--red2);color:var(--red);font-weight:900;margin-top:9px}
.collect small{display:block;font-size:12px;margin-top:2px}
.actionstack{display:grid;gap:8px;margin-top:10px}
.actionstack .btn{margin:0;min-height:58px}
.actionstack .btn.secondary{color:var(--ink)}
.closehero{background:var(--green);color:var(--paper);border-radius:22px;padding:18px;margin:5px 0 12px}
.closehero .eyebrow{color:inherit;opacity:.8}
.closehero strong{display:block;font-size:32px;letter-spacing:-.05em;margin:3px 0}
.closehero span{font-size:13px}
.closegrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.closecard{border:1px solid var(--line);background:var(--surface);border-radius:17px;padding:13px;min-height:98px}
.closecard span{font-size:12px;color:var(--muted);font-weight:750}
.closecard strong{display:block;font-size:23px;letter-spacing:-.04em;margin-top:5px}
.smallnote{margin:13px 3px;color:var(--muted);font-size:12px;line-height:1.45}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:18px;padding:22px;text-align:center;color:var(--muted)}
.login{padding-top:12px}
.login h2{font-size:22px;margin:0 0 4px}
.login p{color:var(--muted);margin:0 0 14px;font-size:14px}
.login label{display:block;font-size:13px;font-weight:800;margin:10px 0 4px}
.login input{width:100%;min-height:52px;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:0 14px;font-size:16px}
.err{color:var(--red);font-weight:750;font-size:14px;margin-top:10px;min-height:20px}
.bottom{height:calc(var(--navh) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border-top:1px solid var(--line);flex:none}
.bottom.off{display:none}
.navbtn{border:0;background:transparent;color:var(--muted);font-size:11px;font-weight:850;display:flex;flex-direction:column;gap:3px;align-items:center;justify-content:center;position:relative}
.navbtn .icon{font-size:21px;line-height:1}
.navbtn.active{color:var(--green)}
.navbtn.active:before{content:"";position:absolute;top:0;width:34px;height:3px;background:var(--orange);border-radius:0 0 4px 4px}
.toast{position:absolute;bottom:calc(var(--navh) + 16px + env(safe-area-inset-bottom));left:16px;right:16px;padding:13px 15px;background:var(--ink);color:var(--surface);border-radius:14px;font-size:14px;font-weight:750;display:none;z-index:5}
</style>
</head>
<body>
<div class="phone" id="app">
  <header class="top">
    <div class="brand" aria-hidden="true">✳</div>
    <div class="topcopy"><div class="eyebrow">once · verdulería</div><h1 id="title">Para repartir</h1></div>
    <button class="iconbtn" id="btn-tema" aria-label="Cambiar tema">☼</button>
    <button class="iconbtn" id="btn-salir" aria-label="Cerrar sesión" hidden>⎋</button>
  </header>
  <main id="main">
    <section class="screen" id="screen-login"></section>
    <section class="screen" id="screen-list"></section>
    <section class="screen" id="screen-next"></section>
    <section class="screen" id="screen-detail"></section>
    <section class="screen" id="screen-close"></section>
  </main>
  <nav class="bottom off" id="nav" aria-label="Navegación principal">
    <button class="navbtn active" data-tab="list"><span class="icon">▤</span>Repartir</button>
    <button class="navbtn" data-tab="next"><span class="icon">⌖</span>Siguiente</button>
    <button class="navbtn" data-tab="close"><span class="icon">▣</span>Cierre</button>
  </nav>
  <div class="toast" id="toast" role="status"></div>
</div>
<script type="module" src="reparto.js"></script>
</body>
</html>
