<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>once · panel</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <span class="brand">once</span>
  <span class="brand-sub">panel</span>
  <button id="btn-campana" class="btn-campana oculto" aria-label="Alertas">
    🔔<span id="badge-alertas" class="badge-alertas oculto">0</span>
  </button>
</header>

<section id="vista-login" class="admin-contenido">
  <form id="form-login" class="form-login">
    <label>Email
      <input type="email" id="login-email" required autocomplete="username">
    </label>
    <label>Contraseña
      <input type="password" id="login-password" required autocomplete="current-password">
    </label>
    <button type="submit" class="btn-primario btn-ancho">Entrar</button>
    <p id="login-error" class="error oculto"></p>
  </form>
</section>

<main id="vista-panel" class="admin-contenido oculto">

  <div id="tarjeta-clima" class="tarjeta-clima oculto"></div>

  <section class="bloque">
    <a href="armado.html" class="btn-primario btn-enlace">Pedidos por armar (WhatsApp)</a>
  </section>

  <section class="bloque">
    <h2>Pendientes de confirmar</h2>
    <div id="lista-pendientes"><p class="muted">Cargando…</p></div>
  </section>

  <section class="bloque">
    <h2>Hoy</h2>
    <div id="resumen-hoy" class="resumen-grid"></div>
  </section>

  <section class="bloque">
    <a href="compras.html" class="btn-primario btn-enlace">Cargar compras y mermas</a>
  </section>

  <section class="bloque">
    <a href="promociones.html" class="btn-primario btn-enlace">Gestionar promociones</a>
  </section>

  <section class="bloque">
    <a href="clientes.html" class="btn-primario btn-enlace">Clientes y cuenta corriente</a>
  </section>

  <section class="bloque">
    <a href="horario.html" class="btn-texto btn-enlace" style="text-align:center; display:block;">Editar horario habitual</a>
  </section>

  <button id="btn-salir" class="btn-texto">Cerrar sesión</button>
</main>

<div id="modal-alerta-critica" class="modal-alerta oculto">
  <div class="modal-alerta-caja modal-alerta-critica-caja">
    <span class="modal-alerta-icono">⚠️</span>
    <h3>Atención</h3>
    <p id="modal-alerta-critica-mensaje"></p>
    <button id="btn-cerrar-alerta-critica" class="btn-primario btn-ancho">Entendido</button>
  </div>
</div>

<div id="modal-cuenta-corriente" class="modal-alerta oculto">
  <div class="modal-alerta-caja modal-lista-caja">
    <div class="panel-header">
      <h2>Cargar a cuenta</h2>
      <button id="btn-cerrar-modal-cc" class="btn-texto">Cerrar</button>
    </div>
    <p class="muted" style="margin-top:-4px;">Se recalcula el pedido a precio de lista, sin promociones.</p>
    <label>Cliente
      <select id="cc-select-cliente"></select>
    </label>
    <button id="btn-confirmar-cc" class="btn-primario btn-ancho" style="margin-top:12px;">Confirmar cargo</button>
    <p id="cc-error" class="error oculto"></p>
  </div>
</div>

<div id="modal-lista-alertas" class="modal-alerta oculto">
  <div class="modal-alerta-caja modal-lista-caja">
    <div class="panel-header">
      <h2>Alertas</h2>
      <button id="btn-cerrar-lista-alertas" class="btn-texto">Cerrar</button>
    </div>
    <div id="lista-alertas-contenido"><p class="muted">Cargando…</p></div>
  </div>
</div>

<script type="module" src="admin.js"></script>
</body>
</html>
