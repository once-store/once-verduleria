<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc">
  <title id="title">Inventario · Once</title>
  <desc id="desc">Boceto de una página independiente de Inventario, con navegación lateral completa, filtro por local, resumen de existencias y detalle de lotes con margen sobre costo.</desc>
  <defs>
    <style>
      .ui{font-family:Inter,Arial,sans-serif;fill:#1f3026}.muted{fill:#718078}.small{font-size:12px}.tiny{font-size:10px}.label{font-size:11px;letter-spacing:1.5px;font-weight:700}.bold{font-weight:700}.green{fill:#28784b}.negative{fill:#b74737}.white{fill:#fff}
    </style>
  </defs>
  <rect width="1600" height="1050" fill="#edf1ed"/>
  <rect x="16" y="16" width="1568" height="1018" rx="18" fill="#fff" stroke="#d7dfd8"/>
  <!-- Sidebar of a separate page -->
  <path d="M34 16h218v1018H34a18 18 0 0 1-18-18V34a18 18 0 0 1 18-18Z" fill="#173f2d"/>
  <circle cx="61" cy="54" r="14" fill="#e6f1e8"/><text x="61" y="59" text-anchor="middle" class="ui bold" font-size="15" fill="#173f2d">o</text>
  <text x="84" y="59" class="ui white bold" font-size="15">once · panel</text>
  <line x1="48" y1="82" x2="235" y2="82" stroke="#ffffff" stroke-opacity=".16"/>
  <text x="52" y="116" font-family="Arial,sans-serif" font-size="10" letter-spacing="1.2" fill="#9cb7a4">OPERACIÓN</text>
  <!-- Navigation -->
  <g font-family="Inter,Arial,sans-serif" font-size="13" fill="#d4e1d7">
    <g><text x="59" y="157" font-size="16" fill="#a9c5b0">◫</text><text x="88" y="157">Panel</text></g>
    <g><text x="59" y="202" font-size="16" fill="#a9c5b0">▣</text><text x="88" y="202">Pedidos por armar</text></g>
    <g><text x="59" y="247" font-size="16" fill="#a9c5b0">▤</text><text x="88" y="247">Mercadería</text></g>
    <g><text x="59" y="292" font-size="16" fill="#a9c5b0">◇</text><text x="88" y="292">Promociones</text></g>
    <g><text x="59" y="337" font-size="16" fill="#a9c5b0">♙</text><text x="88" y="337">Clientes</text></g>
    <g><text x="59" y="382" font-size="16" fill="#a9c5b0">◌</text><text x="88" y="382">Conversaciones</text></g>
    <g><text x="59" y="427" font-size="16" fill="#a9c5b0">▣</text><text x="88" y="427">Caja</text></g>
  </g>
  <text x="52" y="478" font-family="Arial,sans-serif" font-size="10" letter-spacing="1.2" fill="#9cb7a4">ANÁLISIS</text>
  <g font-family="Inter,Arial,sans-serif" font-size="13">
    <text x="59" y="519" font-size="16" fill="#a9c5b0">⌁</text><text x="88" y="519" fill="#d4e1d7">Números</text>
    <rect x="43" y="535" width="199" height="42" rx="8" fill="#ffffff" fill-opacity=".14"/>
    <rect x="43" y="542" width="3" height="28" rx="2" fill="#a1d6ae"/>
    <text x="59" y="562" font-size="16" fill="#d7f0dd">▤</text><text x="88" y="562" class="white bold">Inventario</text>
    <text x="59" y="607" font-size="16" fill="#a9c5b0">◷</text><text x="88" y="607" fill="#d4e1d7">Editar horario</text>
  </g>
  <line x1="48" y1="976" x2="235" y2="976" stroke="#ffffff" stroke-opacity=".16"/>
  <text x="52" y="1002" font-family="Arial,sans-serif" font-size="10" fill="#adc4b3">Sesión de ejemplo · Dueño</text>
  <!-- Main content -->
  <rect x="252" y="16" width="1332" height="58" fill="#fff"/>
  <line x1="252" y1="74" x2="1584" y2="74" stroke="#dfe7e0"/>
  <text x="286" y="53" class="ui muted" font-size="20">☰</text>
  <text x="286" y="119" class="ui green label">ONCE · STOCK DEL LOCAL</text>
  <text x="286" y="160" class="ui bold" font-size="30">Inventario</text>
  <text x="286" y="188" class="ui muted" font-size="14">Un vistazo al stock que tenés, dónde está y qué hay en cada lote.</text>
  <text x="1344" y="126" class="ui muted tiny">LOCAL</text>
  <rect x="1344" y="137" width="205" height="42" rx="9" fill="#fff" stroke="#dfe7e0"/>
  <text x="1360" y="163" class="ui" font-size="12">Local Principal</text><text x="1531" y="163" class="ui muted" font-size="12">⌄</text>
  <!-- Summary cards -->
  <g>
    <rect x="286" y="211" width="397" height="84" rx="12" fill="#f5f8f5" stroke="#dfe7e0"/>
    <circle cx="319" cy="253" r="19" fill="#e7f1e8"/><text x="319" y="258" text-anchor="middle" class="ui green" font-size="15">▤</text>
    <text x="350" y="246" class="ui muted small">Productos con stock</text><text x="350" y="271" class="ui bold" font-size="17">16 productos</text>
    <rect x="697" y="211" width="397" height="84" rx="12" fill="#f5f8f5" stroke="#dfe7e0"/>
    <circle cx="730" cy="253" r="19" fill="#e7f1e8"/><text x="730" y="258" text-anchor="middle" class="ui green" font-size="15">⌂</text>
    <text x="761" y="246" class="ui muted small">Lotes en salón</text><text x="761" y="271" class="ui bold" font-size="17">21 lotes</text>
    <rect x="1108" y="211" width="441" height="84" rx="12" fill="#f5f8f5" stroke="#dfe7e0"/>
    <circle cx="1141" cy="253" r="19" fill="#e7f1e8"/><text x="1141" y="258" text-anchor="middle" class="ui green" font-size="15">▦</text>
    <text x="1172" y="246" class="ui muted small">Lotes en depósito</text><text x="1172" y="271" class="ui bold" font-size="17">0 lotes</text>
  </g>
  <!-- Stock table -->
  <rect x="286" y="314" width="1263" height="575" rx="13" fill="#fff" stroke="#dfe7e0"/>
  <text x="308" y="347" class="ui bold" font-size="15">Stock por producto</text>
  <text x="1410" y="347" text-anchor="end" class="ui muted small">16 productos con existencia</text>
  <rect x="308" y="365" width="884" height="39" rx="8" fill="#fff" stroke="#dbe4dc"/>
  <text x="323" y="390" class="ui muted" font-size="15">⌕</text><text x="348" y="389" class="ui muted small">Buscar producto…</text>
  <rect x="1207" y="365" width="319" height="39" rx="9" fill="#fafcf9" stroke="#dfe7e0"/>
  <rect x="1212" y="370" width="101" height="29" rx="7" fill="#e7f2e9"/><text x="1262" y="389" text-anchor="middle" class="ui green bold tiny">Todos</text>
  <text x="1360" y="389" text-anchor="middle" class="ui muted tiny">Salón</text><text x="1465" y="389" text-anchor="middle" class="ui muted tiny">Depósito</text>
  <rect x="287" y="420" width="1261" height="38" fill="#f7f9f7"/>
  <line x1="287" y1="458" x2="1548" y2="458" stroke="#dfe7e0"/>
  <g class="ui muted" font-size="9" font-weight="700" letter-spacing=".7">
    <text x="309" y="444">PRODUCTO</text><text x="715" y="444">TOTAL</text><text x="895" y="444">SALÓN</text><text x="1070" y="444">DEPÓSITO</text><text x="1265" y="444">LOTES</text>
  </g>
  <!-- Expanded example -->
  <rect x="287" y="459" width="1261" height="55" fill="#fbfdfb"/>
  <text x="309" y="483" class="ui bold small">Papa</text><text x="309" y="501" class="ui muted tiny">Por peso · kg</text>
  <text x="715" y="489" class="ui bold small">— kg</text><text x="895" y="489" class="ui small">— kg</text><text x="1070" y="489" class="ui small">—</text><text x="1265" y="489" class="ui muted small">2 lotes</text><text x="1510" y="490" class="ui muted" font-size="14">⌃</text>
  <rect x="287" y="514" width="1261" height="265" fill="#fbfdfb"/>
  <text x="331" y="538" class="ui muted tiny" font-weight="700" letter-spacing=".7">DETALLE DE LOTES</text>
  <!-- Lot row 1 -->
  <rect x="322" y="550" width="1196" height="92" rx="9" fill="#fff" stroke="#dfe7e0"/>
  <text x="341" y="574" class="ui bold small">PAPA-1609</text><text x="341" y="596" class="ui muted tiny">Salón · ingresó 16/09</text>
  <text x="572" y="578" class="ui small">— kg</text><text x="572" y="597" class="ui muted tiny">disponibles</text>
  <text x="731" y="574" class="ui muted tiny">COSTO</text><text x="731" y="596" class="ui small">$1.000 / kg</text>
  <text x="884" y="574" class="ui muted tiny">PRECIO ACTUAL</text><text x="884" y="596" class="ui small">$980 / kg</text>
  <text x="1068" y="578" class="ui negative bold" font-size="14">−2%</text><text x="1068" y="597" class="ui muted tiny">Margen s/ costo</text>
  <rect x="1235" y="562" width="79" height="23" rx="12" fill="#fbf5e8"/><text x="1274" y="577" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" font-weight="700" fill="#927025">EN OFERTA</text>
  <text x="1237" y="608" class="ui muted tiny">Precio regular: <tspan text-decoration="line-through">$1.150 / kg</tspan></text>
  <text x="1458" y="589" class="ui green tiny">En venta</text>
  <!-- Lot row 2 -->
  <rect x="322" y="652" width="1196" height="92" rx="9" fill="#fff" stroke="#dfe7e0"/>
  <text x="341" y="676" class="ui bold small">PAPA-1609-B</text><text x="341" y="698" class="ui muted tiny">Salón · ingresó 16/09</text>
  <text x="572" y="680" class="ui small">— kg</text><text x="572" y="699" class="ui muted tiny">disponibles</text>
  <text x="731" y="676" class="ui muted tiny">COSTO</text><text x="731" y="698" class="ui small">$1.000 / kg</text>
  <text x="884" y="676" class="ui muted tiny">PRECIO ACTUAL</text><text x="884" y="698" class="ui small">$1.000 / kg</text>
  <text x="1068" y="680" class="ui muted bold" font-size="14">0%</text><text x="1068" y="699" class="ui muted tiny">Margen s/ costo</text>
  <rect x="1235" y="664" width="68" height="23" rx="12" fill="#eef2ef"/><text x="1269" y="679" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" font-weight="700" fill="#66746b">REGULAR</text>
  <text x="1237" y="710" class="ui muted tiny">Precio sin rebaja</text><text x="1458" y="691" class="ui green tiny">En venta</text>
  <!-- Other product rows -->
  <line x1="287" y1="779" x2="1548" y2="779" stroke="#e9eee9"/>
  <text x="309" y="806" class="ui bold small">Cebolla blanca</text><text x="309" y="824" class="ui muted tiny">Por peso · kg</text><text x="715" y="811" class="ui small">— kg</text><text x="895" y="811" class="ui small">— kg</text><text x="1070" y="811" class="ui small">—</text><text x="1265" y="811" class="ui muted small">1 lote</text><text x="1510" y="812" class="ui muted" font-size="14">⌄</text>
  <line x1="287" y1="842" x2="1548" y2="842" stroke="#e9eee9"/>
  <text x="309" y="869" class="ui bold small">Huevos</text><text x="309" y="884" class="ui muted tiny">Por unidad · un.</text><text x="715" y="874" class="ui small">— un.</text><text x="895" y="874" class="ui small">— un.</text><text x="1070" y="874" class="ui small">—</text><text x="1265" y="874" class="ui muted small">1 lote</text><text x="1510" y="875" class="ui muted" font-size="14">⌄</text>
  <!-- Notes -->
  <rect x="286" y="907" width="1263" height="56" rx="10" fill="#f4f8f4"/>
  <circle cx="309" cy="935" r="10" fill="#fff"/><text x="309" y="939" text-anchor="middle" class="ui green bold" font-size="11">i</text>
  <text x="328" y="931" class="ui muted tiny">El total se muestra por producto y en su unidad. Desplegá una fila para ver código, ubicación, fecha, costo, precio, estado y margen sobre costo.</text>
  <text x="328" y="948" class="ui muted tiny">Los lotes en oferta muestran el precio regular y el margen puede ser negativo o 0%.</text>
  <text x="286" y="989" class="ui green tiny">Costos y margen visibles solo para Dueño y Encargado.</text>
  <text x="1549" y="989" text-anchor="end" class="ui muted tiny">Previsualización · cantidades ilustrativas</text>
</svg>
