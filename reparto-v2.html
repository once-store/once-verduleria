<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f5f0">
<title>Reparto · once</title>
<style>
:root{
  color-scheme:light;
  --bg:#f6f5f0;--surface:#ffffff;--ink:#16191a;--muted:#505a55;--line:#d9dcd3;
  --accent:#0b6a3b;--on-accent:#ffffff;--tint:#e6f0e8;
  --cobrar-bg:#b3261e;--cobrar-fg:#ffffff;--alert:#b3261e;
  --warn-bg:#fff0d2;--warn-ink:#6b4300;
  --frame:#d8dbd2;--shadow:0 18px 50px rgba(22,25,26,.18),0 3px 10px rgba(22,25,26,.08);
  --nav-h:68px;
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0f1311;--surface:#171c19;--ink:#f1f4ef;--muted:#a7b2ab;--line:#2a322d;
  --accent:#58c98a;--on-accent:#06140c;--tint:#1b2a21;
  --cobrar-bg:#f28b7f;--cobrar-fg:#2b0a07;--alert:#ff9b8f;
  --warn-bg:#3a2c12;--warn-ink:#ffd58a;
  --frame:#080a09;--shadow:0 18px 50px rgba(0,0,0,.6),0 3px 10px rgba(0,0,0,.4);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme]){
    color-scheme:dark;
    --bg:#0f1311;--surface:#171c19;--ink:#f1f4ef;--muted:#a7b2ab;--line:#2a322d;
    --accent:#58c98a;--on-accent:#06140c;--tint:#1b2a21;
    --cobrar-bg:#f28b7f;--cobrar-fg:#2b0a07;--alert:#ff9b8f;
    --warn-bg:#3a2c12;--warn-ink:#ffd58a;
    --frame:#080a09;--shadow:0 18px 50px rgba(0,0,0,.6),0 3px 10px rgba(0,0,0,.4);
  }
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--frame);color:var(--ink);font:400 16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;display:grid;place-items:center;-webkit-text-size-adjust:100%}
button,input,a{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
a{text-decoration:none}
::selection{background:var(--accent);color:var(--on-accent)}
input{caret-color:var(--accent);accent-color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
button:disabled{opacity:.5;cursor:default}
.i{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}

.phone{width:min(430px,100vw);height:min(880px,100dvh);background:var(--bg);display:flex;flex-direction:column;position:relative;overflow:hidden}
@media (min-width:520px){.phone{height:min(880px,calc(100dvh - 32px));border-radius:28px;box-shadow:var(--shadow)}}

.top{display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 16px 8px}
.top h1{flex:1;margin:0;font-size:23px;line-height:1.15;font-weight:750;letter-spacing:-.02em}
.iconbtn{width:48px;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;transition:background-color .15s}
.iconbtn:active{background:var(--tint)}

main{flex:1;overflow:auto;padding:0 16px 24px;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.screen{display:none}
.screen.active{display:block}

.m{font-variant-numeric:tabular-nums lining-nums;font-weight:800;letter-spacing:-.02em;white-space:nowrap}
.m .cur{font-size:.58em;font-weight:700;vertical-align:.5em;margin-right:.1em}

.strip{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:6px 0 12px;border-bottom:1px solid var(--line);color:var(--muted);font-size:15px}
.strip b{color:var(--ink);font-weight:750}
.strip .m{color:var(--alert);font-size:19px}
.fresh{margin:0;padding:8px 0 0;color:var(--muted);font-size:13px}

.rows{margin:0}
.order{width:100%;display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;padding:14px 0;min-height:84px}
.order.cur{background:var(--tint);margin:0 -16px;padding:14px 16px;width:calc(100% + 32px)}
.order:active{background:var(--tint)}
.stop{width:40px;height:40px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font-size:17px;font-weight:800;font-variant-numeric:tabular-nums}
.cur .stop{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.stop.issue{border-color:var(--alert);color:var(--alert)}
.who{min-width:0}
.num{font-size:18px;font-weight:750;line-height:1.2}
.num .chip{margin-left:6px;font-size:12px;font-weight:700;color:var(--accent);vertical-align:2px}
.ref{margin:2px 0 0;font-size:15px;line-height:1.3;color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.items{margin:2px 0 0;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.right{text-align:right}
.right .m{font-size:21px;display:block}
.status{display:block;margin-top:3px;font-size:13px;font-weight:700;color:var(--accent)}
.status.cobrar{color:var(--alert)}
.status.warn{color:var(--warn-ink);background:var(--warn-bg);padding:1px 6px;border-radius:6px}

.empty{margin:24px 0;padding:0;color:var(--muted);font-size:15px;line-height:1.5}
.empty b{display:block;color:var(--ink);font-size:18px;margin-bottom:4px}
.note{margin:16px 0 0;color:var(--muted);font-size:13px;line-height:1.5}

.btn{width:100%;min-height:56px;border:0;border-radius:12px;background:var(--accent);color:var(--on-accent);font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;transition:filter .15s}
.btn:active{filter:brightness(.92)}
.btn.line{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.btn.danger{background:transparent;color:var(--alert);border:1.5px solid var(--alert)}
.btn.off{opacity:.4;pointer-events:none}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.back{display:flex;align-items:center;gap:4px;border:0;background:transparent;color:var(--accent);font-weight:700;font-size:16px;min-height:48px;padding:0}
.head{display:flex;align-items:center;gap:12px;padding:2px 0 14px}
.head .who{flex:1}
.head .num{font-size:26px;letter-spacing:-.02em}
.head .right .m{font-size:26px}
.where{display:flex;gap:10px;align-items:flex-start;padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.where .i{margin-top:2px;color:var(--accent)}
.where b{display:block;font-weight:650;overflow-wrap:anywhere}
.where small{color:var(--muted);font-size:14px}
.block{padding:14px 0;border-bottom:1px solid var(--line)}
.block h3{margin:0 0 4px;font-size:14px;font-weight:700;color:var(--muted)}
.line-item{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:16px}
.line-item:last-of-type{border-bottom:0}
.line-item span:last-child{font-weight:700;font-variant-numeric:tabular-nums}
.total{display:flex;justify-content:space-between;align-items:baseline;padding-top:10px;font-weight:750;font-size:17px}
.cobrar-box{margin:14px 0;padding:14px 16px;border-radius:12px;background:var(--cobrar-bg);color:var(--cobrar-fg)}
.cobrar-box > span{display:block;font-size:14px;font-weight:600}
.cobrar-box > .m{font-size:34px;display:block;line-height:1.15}
.paid-box{margin:14px 0;padding:12px 16px;border-radius:12px;background:var(--tint);color:var(--accent);font-weight:750;display:flex;align-items:center;gap:8px}
.contact{margin-top:14px}
.contact .btn{min-height:52px;font-size:16px}
.actionbar{position:sticky;bottom:0;margin:16px -16px -24px;padding:12px 16px calc(12px + env(safe-area-inset-bottom) * 0);background:var(--bg);border-top:1px solid var(--line);display:grid;gap:10px;box-shadow:0 -6px 14px rgba(22,25,26,.06)}
.actionbar .btn{min-height:58px}

.mapa-wrap{position:relative;height:clamp(250px,44vh,420px);margin-top:4px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.mapa{position:absolute;inset:0}
.mapa-aviso{position:absolute;inset:0;display:grid;place-items:center;padding:20px;text-align:center;color:var(--muted);background:var(--surface);font-size:15px;line-height:1.45;z-index:2}
.mapa-aviso[hidden]{display:none}
.pin{width:40px;height:40px;padding:0;border-radius:50%;border:2px solid var(--ink);background:var(--surface);color:var(--ink);font-weight:800;font-size:16px;font-variant-numeric:tabular-nums;display:grid;place-items:center;box-shadow:0 1px 5px rgba(0,0,0,.4)}
.pin.sig{width:48px;height:48px;background:var(--accent);border-color:var(--surface);color:var(--on-accent);font-size:19px}
.pin.sel{box-shadow:0 0 0 4px var(--ink)}
.pin.local{border-radius:12px;background:var(--ink);color:var(--bg)}
.ruta-info{margin:10px 0 0;color:var(--muted);font-size:14px}
.next-card{padding:14px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center}
.next-actions{display:grid;gap:10px;margin-top:16px}

.ledger{margin:6px 0 0}
.ledger div{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.ledger dt{color:var(--muted);font-size:15px}
.ledger dd{margin:0;font-weight:750;font-variant-numeric:tabular-nums}
.ledger .key dt{color:var(--ink);font-weight:700;font-size:16px}
.ledger .key dd .m{font-size:30px}
.ledger dd .m{font-size:19px}

.login{padding-top:20px}
.login h2{margin:0 0 4px;font-size:22px;letter-spacing:-.02em}
.login p{margin:0 0 16px;color:var(--muted);font-size:15px}
.login label{display:block;margin:14px 0 6px;font-size:14px;font-weight:700}
.login input{width:100%;min-height:52px;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:0 14px;font-size:16px}
.login input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--tint)}
.login .btn{margin-top:18px}
.err{min-height:22px;margin-top:10px;color:var(--alert);font-size:15px;font-weight:650}

.bottom{height:calc(var(--nav-h) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border-top:1px solid var(--line);flex:none}
.bottom.off{display:none}
.navbtn{border:0;background:transparent;color:var(--muted);font-size:12px;font-weight:650;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;position:relative}
.navbtn.active{color:var(--accent);font-weight:750}
.navbtn.active:after{content:"";position:absolute;top:0;width:36px;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
.toast{position:absolute;left:16px;right:16px;bottom:calc(var(--nav-h) + 14px + env(safe-area-inset-bottom));padding:13px 16px;background:var(--ink);color:var(--bg);border-radius:12px;font-size:15px;font-weight:600;display:none;z-index:5;box-shadow:0 8px 20px rgba(0,0,0,.25)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-list" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01"/></symbol>
  <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.3"/></symbol>
  <symbol id="i-receipt" viewBox="0 0 24 24"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9.5 8h5M9.5 12h5"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></symbol>
  <symbol id="i-out" viewBox="0 0 24 24"><path d="M10 4H5v16h5M15 8l4 4-4 4M19 12H9"/></symbol>
  <symbol id="i-phone" viewBox="0 0 24 24"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></symbol>
  <symbol id="i-chat" viewBox="0 0 24 24"><path d="M4 5h16v11H9.5L4 20z"/></symbol>
  <symbol id="i-ext" viewBox="0 0 24 24"><path d="M7 17L17 7M9 7h8v8"/></symbol>
  <symbol id="i-moto" viewBox="0 0 24 24"><circle cx="6" cy="17" r="2.5"/><circle cx="18" cy="17" r="2.5"/><path d="M8.5 17h5l2-7h-3M9 10h3M15.5 10l2.5 7"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
  <symbol id="i-store" viewBox="0 0 24 24"><path d="M4 10l1.5-5h13L20 10M4 10v10h16V10M4 10c0 1.7 1.3 3 3 3s3-1.3 3-3c0 1.7 1.3 3 3 3s3-1.3 3-3c0 1.7 1.3 3 3 3M10 20v-4h4v4"/></symbol>
</svg>
<div class="phone" id="app">
  <header class="top">
    <h1 id="title">Para repartir</h1>
    <button class="iconbtn" id="btn-tema" aria-label="Cambiar entre modo claro y oscuro"><svg class="i"><use href="#i-moon"/></svg></button>
    <button class="iconbtn" id="btn-salir" aria-label="Cerrar sesión" hidden><svg class="i"><use href="#i-out"/></svg></button>
  </header>
  <main id="main">
    <section class="screen" id="screen-login"></section>
    <section class="screen" id="screen-list"></section>
    <section class="screen" id="screen-next"></section>
    <section class="screen" id="screen-detail"></section>
    <section class="screen" id="screen-close"></section>
  </main>
  <nav class="bottom off" id="nav" aria-label="Navegación principal">
    <button class="navbtn active" data-tab="list"><svg class="i"><use href="#i-list"/></svg>Repartir</button>
    <button class="navbtn" data-tab="next"><svg class="i"><use href="#i-pin"/></svg>Mapa</button>
    <button class="navbtn" data-tab="close"><svg class="i"><use href="#i-receipt"/></svg>Cierre</button>
  </nav>
  <div class="toast" id="toast" role="status"></div>
</div>
<script type="module" src="reparto-v2.js"></script>
</body>
</html>
